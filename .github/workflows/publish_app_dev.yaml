name: app-build-action-dev

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  FASTFORGE_REPOSITORY: https://github.com/SlotSun/fastforge.git
  FASTFORGE_COMMIT: 84585c361a727a0eba48dd04f8e6e7c9d940ccad
  MELOS_VERSION: 6.3.3
  APPDMG_VERSION: 0.6.6

jobs:
  quality:
    uses: ./.github/workflows/quality_gate.yml
    with:
      checkout_ref: dev

  build-android:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout dev
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: dev

      - name: Validate Android release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          missing=()
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!name:-}" ]; then
              missing+=("${name}")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Missing required Android release signing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Configure Android signing and optional Firebase files
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FIREBASE_JSON: ${{ secrets.FIREBASE_JSON }}
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          keystore_path="${RUNNER_TEMP}/slive-release-keystore.jks"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          test -s "${keystore_path}"
          cat > simple_live_app/android/key.properties <<PROPERTIES
          storeFile=${keystore_path}
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          PROPERTIES
          if [ -n "${FIREBASE_JSON}" ]; then
            printf '%s' "${FIREBASE_JSON}" | base64 --decode > simple_live_app/android/app/google-services.json
          fi
          if [ -n "${FIREBASE_OPTIONS_DART}" ]; then
            printf '%s' "${FIREBASE_OPTIONS_DART}" | base64 --decode > simple_live_app/lib/firebase_options.dart
          fi

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            simple_live_app/android/*.gradle*
            simple_live_app/android/**/gradle-wrapper.properties

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: simple_live_app/pubspec.yaml
          channel: stable
          cache: true

      - name: Restore packages
        working-directory: simple_live_app
        run: flutter pub get

      - name: Build signed APKs
        working-directory: simple_live_app
        run: flutter build apk --release --split-per-abi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          if-no-files-found: error
          retention-days: 7
          path: |
            simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-x86_64-release.apk

  build-mac-ios:
    needs: quality
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout dev
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: dev

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: simple_live_app/pubspec.yaml
          channel: stable
          cache: true

      - name: Enable Flutter desktop
        run: flutter config --enable-macos-desktop --no-analytics

      - name: Restore packages
        working-directory: simple_live_app
        run: flutter pub get

      - name: Install pinned packaging tools
        run: |
          npm install --global "appdmg@${APPDMG_VERSION}"
          git clone --filter=blob:none "${FASTFORGE_REPOSITORY}" fastforge
          git -C fastforge checkout --detach "${FASTFORGE_COMMIT}"
          dart pub global activate melos "${MELOS_VERSION}"
          cd fastforge
          melos run activate

      - name: Build unsigned iOS app
        working-directory: simple_live_app
        run: flutter build ios --release --no-codesign

      - name: Create unsigned IPA
        working-directory: simple_live_app
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/Runner.app
          cd build/ios/iphoneos
          zip -q -r ios_no_sign.ipa Payload

      - name: Upload iOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios
          if-no-files-found: error
          retention-days: 7
          path: simple_live_app/build/ios/iphoneos/ios_no_sign.ipa

      - name: Build macOS packages
        working-directory: simple_live_app
        run: fastforge package --platform macos --targets dmg,zip --skip-clean

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac
          if-no-files-found: error
          retention-days: 7
          path: |
            simple_live_app/build/dist/*/*.dmg
            simple_live_app/build/dist/*/*.zip

  build-linux:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          # Flutter stable SDK archives currently expose Linux x64 only.
          # ARM64 uses the action's source checkout path while pubspec still pins 3.41.9.
          - runner: ubuntu-24.04
            arch: x86_64
            flutter_channel: stable
          - runner: ubuntu-24.04-arm
            arch: aarch64
            flutter_channel: master
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout dev
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: dev

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: simple_live_app/pubspec.yaml
          channel: ${{ matrix.flutter_channel }}
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev unzip libasound2-dev gcc g++ autoconf automake \
              debhelper glslang-dev ladspa-sdk xutils-dev libarchive-dev libbluray-dev \
              libdav1d-dev libdvdnav-dev libegl1-mesa-dev libepoxy-dev libfontconfig-dev libfreetype6-dev \
              libfribidi-dev libgl1-mesa-dev libgbm-dev libgme-dev libgsm1-dev libharfbuzz-dev libjpeg-dev \
              libbrotli-dev liblcms2-dev libmodplug-dev libmp3lame-dev libopenal-dev \
              libopus-dev libopencore-amrnb-dev libopencore-amrwb-dev libpulse-dev librtmp-dev \
              libsdl2-dev libsixel-dev libssh-dev libsoxr-dev libspeex-dev libtool \
              libv4l-dev libva-dev libvdpau-dev libvorbis-dev libvo-amrwbenc-dev \
              libunwind-dev libvpx-dev libwayland-dev libx11-dev libxext-dev libdrm-dev \
              libxkbcommon-dev libxrandr-dev libxss-dev libxv-dev libxvidcore-dev \
              linux-libc-dev nasm ninja-build pkg-config python3 python3-docutils wayland-protocols \
              x11proto-core-dev zlib1g-dev libfdk-aac-dev libtheora-dev libwebp-dev \
              unixodbc-dev libpq-dev libxxhash-dev libaom-dev libbs2b-dev libcaca-dev libcdio-paranoia-dev

      - name: Enable Flutter desktop
        run: flutter config --enable-linux-desktop --no-analytics

      - name: Restore packages
        working-directory: simple_live_app
        run: flutter pub get

      - name: Install pinned fastforge
        run: |
          git clone --filter=blob:none "${FASTFORGE_REPOSITORY}" fastforge
          git -C fastforge checkout --detach "${FASTFORGE_COMMIT}"
          dart pub global activate melos "${MELOS_VERSION}"
          cd fastforge
          melos run activate

      - name: Build Linux packages
        working-directory: simple_live_app
        run: |
          fastforge package --platform linux --targets deb,zip --skip-clean
          dist_dir="$(find build/dist -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "${dist_dir}"
          mv "${dist_dir}"/simple_live_app-*-linux.deb "${dist_dir}/Slive-${{ matrix.arch }}-linux.deb"
          mv "${dist_dir}"/simple_live_app-*-linux.zip "${dist_dir}/Slive-${{ matrix.arch }}-linux.zip"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          path: |
            simple_live_app/build/dist/*/*.deb
            simple_live_app/build/dist/*/*.zip

  build-windows:
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout dev
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: dev

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: simple_live_app/pubspec.yaml
          channel: stable
          cache: true

      - name: Enable Flutter desktop
        run: flutter config --enable-windows-desktop --no-analytics

      - name: Restore packages
        working-directory: simple_live_app
        run: flutter pub get

      - name: Install pinned packaging tools
        shell: pwsh
        run: |
          git clone --filter=blob:none "$env:FASTFORGE_REPOSITORY" fastforge
          git -C fastforge checkout --detach "$env:FASTFORGE_COMMIT"
          dart pub global activate melos "$env:MELOS_VERSION"
          Push-Location fastforge
          melos run activate
          Pop-Location
          $innoSetup = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $innoSetup)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $innoSetup)) {
            throw "Inno Setup compiler was not found at $innoSetup"
          }

      - name: Add Chinese language file for Inno Setup
        shell: pwsh
        run: Copy-Item "simple_live_app/windows/packaging/exe/ChineseSimplified.isl" "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"

      - name: Build Windows packages
        working-directory: simple_live_app
        shell: pwsh
        run: |
          fastforge package --platform windows --targets msix,zip,exe --skip-clean
          $distDirectory = Get-ChildItem "build/dist" -Directory | Select-Object -First 1
          if ($null -eq $distDirectory) { throw "Fastforge did not create build/dist output." }
          Get-ChildItem $distDirectory.FullName -Filter "simple_live_app-*" | ForEach-Object {
            $newName = $_.Name -replace '^simple_live_app', 'Slive'
            Rename-Item $_.FullName -NewName $newName
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          if-no-files-found: error
          retention-days: 7
          path: |
            simple_live_app/build/dist/*/*.msix
            simple_live_app/build/dist/*/*.zip
            simple_live_app/build/dist/*/*.exe
